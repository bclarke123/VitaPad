VitaPadKernel5:
  attributes: 0
  version:
    major: 1
    minor: 0
  main:
    start: module_start
    stop: module_stop
  libraries:
    VitaPadKernel5Library:
      syscall: true
      functions:
        - vitapadKernelGetButtons
        - vitapadKernelUsbStart
        - vitapadKernelUsbStop
        - vitapadKernelUsbSetReport
        - vitapadKernelUsbGetState
        - vitapadKernelFastStart
        - vitapadKernelFastStop
        - vitapadKernelFastGetButtons
        - vitapadKernelFastGetStats

# The module and library names carry an ABI version: bump it whenever the syscalls change.
# A kernel module stays loaded until the Vita reboots, so an app update would otherwise find the
# previous module (without the new functions) and crash calling them.
# (Keep this comment at the end: vita_create_stubs reads the name from the first line.)
